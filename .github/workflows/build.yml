name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional, default = commit count)'
        required: false
        default: ''

jobs:
  build:
    name: Build LuxGram IPA
    runs-on: macos-26

    steps:
      # 1 — Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2 — Select Xcode 26.2 ──────────────────────────────────────────────
      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      # 3 — JDK 21 (Bazel needs it) ─────────────────────────────────────────
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 4a — Import fake self-signed certificate for unsigned CI builds ────────
      - name: Import fake codesigning certificate
        run: |
          KP="$RUNNER_TEMP/fake.keychain"
          KPW="fake-keychain-password"
          security create-keychain -p "$KPW" "$KP"
          security set-keychain-settings -lut 21600 "$KP"
          security unlock-keychain -p "$KPW" "$KP"
          security import build-system/fake-codesigning/certs/SelfSigned.p12 \
            -k "$KP" -P "" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          EXISTING=$(security list-keychains -d user | tr -d '" \t\n')
          security list-keychains -d user -s "$KP" $EXISTING
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KP"
          echo "FAKE_KEYCHAIN_PATH=$KP" >> "$GITHUB_ENV"
          echo "FAKE_KEYCHAIN_PASSWORD=$KPW" >> "$GITHUB_ENV"
          security find-identity -v "$KP" | head -5

      # 4b — Import real signing certificate (skip if secret not set) ──────────
      - name: Import certificate
        if: env.CERTIFICATE_P12_BASE64 != ''
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD:   ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KP="$RUNNER_TEMP/build.keychain"
          KPW=$(openssl rand -base64 32)
          security create-keychain -p "$KPW" "$KP"
          security set-keychain-settings -lut 21600 "$KP"
          security unlock-keychain -p "$KPW" "$KP"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KP"
          security list-keychain -d user -s "$KP"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KPW" "$KP"
          echo "KEYCHAIN_PATH=$KP" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KPW" >> "$GITHUB_ENV"

      # 5 — Install provisioning profile (skip if secret not set) ──────────
      - name: Install provisioning profile
        if: env.PROVISIONING_PROFILE_BASE64 != ''
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PP_DIR/LuxGram.mobileprovision"
          echo "Provisioning profile installed"

      # 6 — Write build config ──────────────────────────────────────────────
      - name: Write build configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 -c "
          import json, os
          # Use secret if set and non-empty; fall back to the fake-codesigning team ID
          team_id = os.environ.get('APPLE_TEAM_ID') or '6W9S44UXF2'
          cfg = {
            'bundle_id': 'app.luxgram.com',
            'api_id': '35971841',
            'api_hash': '504a05393f81633f94c433502e9b09e6',
            'team_id': team_id,
            'app_center_id': '0',
            'is_internal_build': 'false',
            'is_appstore_build': 'true',
            'appstore_id': '0',
            'app_specific_url_scheme': 'tg',
            'premium_iap_product_id': '',
            'enable_siri': False,
            'enable_icloud': False,
            'sg_config': ''
          }
          with open('build-system/ipa-build-configuration.json', 'w') as f:
            json.dump(cfg, f, indent='\t')
          print('Config written: bundle_id =', cfg['bundle_id'], 'team_id =', team_id)
          "

      # 6a — Restore missing libvpx build/make directory ───────────────────
      - name: Restore libvpx build/make directory
        run: |
          LIBVPX_DIR="$(pwd)/third-party/libvpx/libvpx"
          if [ ! -f "$LIBVPX_DIR/build/make/configure.sh" ]; then
            # Sparse-checkout only build/ from the matching tag to avoid a full clone
            git clone --depth 1 --filter=blob:none --sparse \
              -b v1.13.0 https://github.com/webmproject/libvpx.git /tmp/libvpx-src
            cd /tmp/libvpx-src
            git sparse-checkout set build
            cp -R build "$LIBVPX_DIR/"
            cd -
            rm -rf /tmp/libvpx-src
            echo "libvpx build/make restored: $(ls $LIBVPX_DIR/build/make/ | head -10)"
          fi

      # 6b — Cache libopus prebuilt binaries ────────────────────────────────
      - name: Cache libopus prebuilt
        id: cache-opus
        uses: actions/cache@v4
        with:
          path: third-party/opus/prebuilt/arm64
          key: opus-arm64-1.5.1-macos26

      # 6c — Build libopus for arm64 if not cached ──────────────────────────
      - name: Build libopus (arm64)
        if: steps.cache-opus.outputs.cache-hit != 'true'
        run: |
          OPUS_DIR="$(pwd)/third-party/opus"
          mkdir -p "$OPUS_DIR/prebuilt/arm64"
          sh "$OPUS_DIR/build-opus-bazel.sh" arm64 "$OPUS_DIR" opus-1.5.1.tar.gz
          cp "$OPUS_DIR/built/lib/libopus.a" "$OPUS_DIR/prebuilt/arm64/libopus.a"
          rm -rf "$OPUS_DIR/src" "$OPUS_DIR/built"
          echo "libopus built: $(ls -lh $OPUS_DIR/prebuilt/arm64/libopus.a)"

      # 7 — Regenerate fake provisioning profiles with LuxGram bundle ID ────
      - name: Regenerate fake codesigning profiles
        run: |
          python3 build-system/Make/GenerateProfiles.py \
            --sourcePath=build-system/fake-codesigning/profiles \
            --destinationPath=build-system/fake-codesigning/profiles \
            --certsPath=build-system/fake-codesigning/certs \
            --sourceTeamId=C67CF9S4VU \
            --targetTeamId=6W9S44UXF2 \
            --sourceBundleId=ph.telegra.Telegraph \
            --targetBundleId=app.luxgram.com

      # 8 — Build IPA ───────────────────────────────────────────────────────
      - name: Build production IPA
        run: |
          INPUT_BN="${{ github.event.inputs.build_number }}"
          if [ -n "$INPUT_BN" ]; then
            BN="$INPUT_BN"
          else
            BN=$(git rev-list --count HEAD)
          fi
          echo "Building LuxGram, build number: $BN"
          CACHE_DIR="${CACHE_DIR:-$HOME/telegram-bazel-cache}"
          mkdir -p build/artifacts
          python3 build-system/Make/Make.py \
            --cacheDir="$CACHE_DIR" \
            build \
            --configurationPath="build-system/ipa-build-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --buildNumber="$BN" \
            --target LuxGram \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="build/artifacts"

      # 9 — Upload artifact ─────────────────────────────────────────────────
      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuxGram-${{ github.run_number }}
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.dSYM.zip
          if-no-files-found: warn
          retention-days: 30

      # 10 — GitHub Release (on version tags v*.*.*) ────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/artifacts/*.ipa
          generate_release_notes: true
