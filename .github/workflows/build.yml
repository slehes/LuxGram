name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional, default = commit count)'
        required: false
        default: ''

jobs:
  build:
    name: Build LuxGram IPA
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup codesigning (generate cert + profiles + keychain)
        run: |
          TEAM_ID="6W9S44UXF2"
          KP="$RUNNER_TEMP/luxgram.keychain"
          KPW="luxgram-keychain-password"
          CERT_DIR="build-system/fake-codesigning/certs"
          P12="$CERT_DIR/SelfSigned.p12"

          # 1 — Generate cert + p12 via Python cryptography (avoids LibreSSL compat issues)
          pip3 install cryptography --quiet 2>/dev/null || true
          python3 - "$P12" "$TEAM_ID" << 'PYEOF'
import sys, datetime
from cryptography import x509
from cryptography.x509.oid import NameOID
from cryptography.hazmat.primitives import hashes, serialization
from cryptography.hazmat.primitives.asymmetric import rsa
from cryptography.hazmat.primitives.serialization import pkcs12

p12_path, team_id = sys.argv[1], sys.argv[2]
key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
name = x509.Name([
    x509.NameAttribute(NameOID.COMMON_NAME, f"Apple Distribution: LuxGram ({team_id})"),
    x509.NameAttribute(NameOID.ORGANIZATIONAL_UNIT_NAME, "SELFSIGNED"),
    x509.NameAttribute(NameOID.COUNTRY_NAME, "US"),
])
now = datetime.datetime.now(datetime.timezone.utc)
cert = (x509.CertificateBuilder()
    .subject_name(name).issuer_name(name)
    .public_key(key.public_key())
    .serial_number(x509.random_serial_number())
    .not_valid_before(now)
    .not_valid_after(now + datetime.timedelta(days=3650))
    .add_extension(x509.BasicConstraints(ca=True, path_length=None), critical=True)
    .sign(key, hashes.SHA256()))
# Use BestAvailableEncryption with empty password - macOS compatible
p12_data = pkcs12.serialize_key_and_certificates(
    name=b"LuxGram", key=key, cert=cert, cas=None,
    encryption_algorithm=serialization.BestAvailableEncryption(b""))
open(p12_path, "wb").write(p12_data)
# Also export cert as PEM for trust setup
open("/tmp/lux.crt", "wb").write(
    cert.public_bytes(serialization.Encoding.PEM))
print(f"Generated p12: {len(p12_data)} bytes")
PYEOF

          echo "P12: $(ls -lh $P12)"

          # 2 — Create keychain and import cert + key
          security create-keychain -p "$KPW" "$KP"
          security set-keychain-settings -lut 21600 "$KP"
          security unlock-keychain -p "$KPW" "$KP"
          security import "$P12" -k "$KP" -P "" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild

          # 3 — Add to keychain search list and set ACL
          EXISTING=$(security list-keychains -d user | xargs)
          security list-keychains -d user -s "$KP" $EXISTING
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KP"

          # 4 — Trust cert so find-identity -p codesigning works
          sudo security add-trusted-cert -d -r trustAsRoot \
            -k /Library/Keychains/System.keychain /tmp/lux.crt || true

          security find-identity -v "$KP" | head -5
          echo "FAKE_KEYCHAIN_PATH=$KP" >> "$GITHUB_ENV"
          echo "FAKE_KEYCHAIN_PASSWORD=$KPW" >> "$GITHUB_ENV"

      - name: Write build configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 -c "
          import json, os
          team_id = os.environ.get('APPLE_TEAM_ID') or '6W9S44UXF2'
          cfg = {
            'bundle_id': 'app.luxgram.com',
            'api_id': '35971841',
            'api_hash': '504a05393f81633f94c433502e9b09e6',
            'team_id': team_id,
            'app_center_id': '0',
            'is_internal_build': 'false',
            'is_appstore_build': 'true',
            'appstore_id': '0',
            'app_specific_url_scheme': 'tg',
            'premium_iap_product_id': '',
            'enable_siri': False,
            'enable_icloud': False,
            'sg_config': ''
          }
          with open('build-system/ipa-build-configuration.json', 'w') as f:
            json.dump(cfg, f, indent='\t')
          print('Config: bundle_id =', cfg['bundle_id'], 'team_id =', team_id)
          "

      - name: Regenerate provisioning profiles with new cert
        run: |
          python3 build-system/Make/GenerateProfiles.py \
            --sourcePath=build-system/fake-codesigning/profiles \
            --destinationPath=build-system/fake-codesigning/profiles \
            --certsPath=build-system/fake-codesigning/certs \
            --sourceTeamId=C67CF9S4VU \
            --targetTeamId=6W9S44UXF2 \
            --sourceBundleId=ph.telegra.Telegraph \
            --targetBundleId=app.luxgram.com

      - name: Restore libvpx build/make directory
        run: |
          LIBVPX_DIR="$(pwd)/third-party/libvpx/libvpx"
          if [ ! -f "$LIBVPX_DIR/build/make/configure.sh" ]; then
            git clone --depth 1 --filter=blob:none --sparse \
              -b v1.13.0 https://github.com/webmproject/libvpx.git /tmp/libvpx-src
            cd /tmp/libvpx-src && git sparse-checkout set build
            cp -R build "$LIBVPX_DIR/" && cd -
            rm -rf /tmp/libvpx-src
          fi

      - name: Cache libopus prebuilt
        id: cache-opus
        uses: actions/cache@v4
        with:
          path: third-party/opus/prebuilt/arm64
          key: opus-arm64-1.5.1-macos26

      - name: Build libopus (arm64)
        if: steps.cache-opus.outputs.cache-hit != 'true'
        run: |
          OPUS_DIR="$(pwd)/third-party/opus"
          mkdir -p "$OPUS_DIR/prebuilt/arm64"
          sh "$OPUS_DIR/build-opus-bazel.sh" arm64 "$OPUS_DIR" opus-1.5.1.tar.gz
          cp "$OPUS_DIR/built/lib/libopus.a" "$OPUS_DIR/prebuilt/arm64/libopus.a"
          rm -rf "$OPUS_DIR/src" "$OPUS_DIR/built"

      - name: Build production IPA
        run: |
          INPUT_BN="${{ github.event.inputs.build_number }}"
          BN="${INPUT_BN:-$(git rev-list --count HEAD)}"
          echo "Building LuxGram build #$BN"
          CACHE_DIR="${CACHE_DIR:-$HOME/telegram-bazel-cache}"
          mkdir -p build/artifacts
          python3 build-system/Make/Make.py \
            --cacheDir="$CACHE_DIR" \
            build \
            --configurationPath="build-system/ipa-build-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --buildNumber="$BN" \
            --target LuxGram \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="build/artifacts"

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuxGram-${{ github.run_number }}
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.dSYM.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/artifacts/*.ipa
          generate_release_notes: true
