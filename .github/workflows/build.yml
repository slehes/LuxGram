name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional, default = commit count)'
        required: false
        default: ''

jobs:
  build:
    name: Build LuxGram IPA
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Patch rules_apple — allow provisioning_profile=None on device builds
        run: |
          BZL="build-system/bazel-rules/rules_apple/apple/internal/partials/provisioning_profile.bzl"
          # Remove the fail() that rejects device builds with no provisioning profile
          sed -i '' 's/if not profile_artifact:/if False:  # patched: allow None for CI/' "$BZL"
          echo "Patch applied:"
          grep -n "if.*profile_artifact" "$BZL"

      - name: Write build configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 -c "
          import json, os
          team_id = os.environ.get('APPLE_TEAM_ID') or '6W9S44UXF2'
          cfg = {
            'bundle_id': 'app.luxgram.com',
            'api_id': '35971841',
            'api_hash': '504a05393f81633f94c433502e9b09e6',
            'team_id': team_id,
            'app_center_id': '0',
            'is_internal_build': 'false',
            'is_appstore_build': 'true',
            'appstore_id': '0',
            'app_specific_url_scheme': 'tg',
            'premium_iap_product_id': '',
            'enable_siri': False,
            'enable_icloud': False,
            'sg_config': ''
          }
          with open('build-system/ipa-build-configuration.json', 'w') as f:
            json.dump(cfg, f, indent='\t')
          print('Config: bundle_id =', cfg['bundle_id'], 'team_id =', team_id)
          "

      - name: Restore libvpx build/make directory
        run: |
          LIBVPX_DIR="$(pwd)/third-party/libvpx/libvpx"
          if [ ! -f "$LIBVPX_DIR/build/make/configure.sh" ]; then
            git clone --depth 1 --filter=blob:none --sparse \
              -b v1.13.0 https://github.com/webmproject/libvpx.git /tmp/libvpx-src
            cd /tmp/libvpx-src && git sparse-checkout set build
            cp -R build "$LIBVPX_DIR/" && cd -
            rm -rf /tmp/libvpx-src
          fi

      - name: Cache libopus prebuilt
        id: cache-opus
        uses: actions/cache@v4
        with:
          path: third-party/opus/prebuilt/arm64
          key: opus-arm64-1.5.1-macos26

      - name: Build libopus (arm64)
        if: steps.cache-opus.outputs.cache-hit != 'true'
        run: |
          OPUS_DIR="$(pwd)/third-party/opus"
          mkdir -p "$OPUS_DIR/prebuilt/arm64"
          sh "$OPUS_DIR/build-opus-bazel.sh" arm64 "$OPUS_DIR" opus-1.5.1.tar.gz
          cp "$OPUS_DIR/built/lib/libopus.a" "$OPUS_DIR/prebuilt/arm64/libopus.a"
          rm -rf "$OPUS_DIR/src" "$OPUS_DIR/built"

      - name: Build production IPA
        run: |
          INPUT_BN="${{ github.event.inputs.build_number }}"
          BN="${INPUT_BN:-$(git rev-list --count HEAD)}"
          echo "Building LuxGram build #$BN"
          CACHE_DIR="${CACHE_DIR:-$HOME/telegram-bazel-cache}"
          mkdir -p build/artifacts
          python3 build-system/Make/Make.py \
            --cacheDir="$CACHE_DIR" \
            build \
            --configurationPath="build-system/ipa-build-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --buildNumber="$BN" \
            --target LuxGram \
            --configuration=release_arm64 \
            --disableProvisioningProfiles \
            --disableExtensions \
            --outputBuildArtifactsPath="build/artifacts"

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuxGram-${{ github.run_number }}
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.dSYM.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/artifacts/*.ipa
          generate_release_notes: true
